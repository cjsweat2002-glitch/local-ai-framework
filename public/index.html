<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Autonomous Framework Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f1115; color: #e1e7f0; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; }
        .app-container { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #161f2b; border-right: 2px solid #233247; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .sidebar-header { margin-bottom: 30px; }
        .sidebar-header h1 { font-size: 1.2rem; color: #40a9ff; }
        .branch-list { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .branch-item { padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; background: #1a222c; color: #c9d1d9; }
        .branch-item:hover { background: #233247; border-color: #40a9ff; }
        .branch-item.active { background: #40a9ff; color: #0f1115; font-weight: 600; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: #0f1115; overflow: hidden; }
        .chat-header { padding: 20px; border-bottom: 2px solid #233247; background: #161f2b; }
        .messages-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; gap: 12px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { justify-content: flex-end; }
        .message-content { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; }
        .message.assistant .message-content { background: #233247; border-left: 3px solid #40a9ff; }
        .message.user .message-content { background: #40a9ff; color: #0f1115; }
        .message.system .message-content { background: #1a222c; color: #8b95a5; font-size: 0.85rem; text-align: center; }
        .input-area { padding: 20px; border-top: 2px solid #233247; background: #161f2b; display: flex; gap: 10px; }
        .message-input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 2px solid #233247; background: #0f1115; color: #e1e7f0; resize: none; }
        .send-button { padding: 12px 20px; background: #40a9ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .loading { display: inline-block; width: 8px; height: 8px; background: #40a9ff; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header"><h1>AI Framework</h1><p>Orchestration Hub</p></div>
            <div class="branch-list" id="branchList"></div>
        </div>
        <div class="main-content">
            <div class="chat-container">
                <div class="chat-header"><h2 id="branchTitle">Welcome</h2><p id="branchDescription">Select a branch to start</p></div>
                <div class="messages-area" id="messagesArea"></div>
                <div class="input-area">
                    <textarea class="message-input" id="messageInput" placeholder="Describe your task..." rows="1"></textarea>
                    <button class="send-button" id="sendButton">Send</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const socket = io();
        const branchList = document.getElementById('branchList');
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const branchTitle = document.getElementById('branchTitle');
        const branches = {
            'code': { icon: '💻', name: 'Code Generation', desc: 'Build and optimize software' },
            'content': { icon: '✍️', name: 'Content Creation', desc: 'Draft and edit copy' },
            'analysis': { icon: '📊', name: 'Data Analysis', desc: 'Process and visualize data' },
            'automation': { icon: '⚙️', name: 'Automation', desc: 'Design workflows' }
        };
        let currentBranch = null;
        let history = [];
        function init() {
            Object.entries(branches).forEach(([key, b]) => {
                const div = document.createElement('div');
                div.className = 'branch-item';
                div.innerHTML = `${b.icon} ${b.name}`;
                div.onclick = () => {
                    currentBranch = key;
                    document.querySelectorAll('.branch-item').forEach(i => i.classList.remove('active'));
                    div.classList.add('active');
                    branchTitle.innerText = b.name;
                    messagesArea.innerHTML = '';
                    addMsg(`Switched to ${b.name} branch.`, 'system');
                };
                branchList.appendChild(div);
            });
        }
        function addMsg(c, s = 'assistant') {
            const d = document.createElement('div');
            d.className = `message ${s}`;
            d.innerHTML = `<div class="message-content">${c}</div>`;
            messagesArea.appendChild(d);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }
        async function send() {
            const m = messageInput.value.trim();
            if (!m || !currentBranch) return;
            addMsg(m, 'user');
            messageInput.value = '';
            const l = document.createElement('div');
            l.className = 'message assistant';
            l.innerHTML = '<div class="message-content">Thinking<span class="loading"></span></div>';
            messagesArea.appendChild(l);
            try {
                const r = await fetch('/api/manus-task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: m, branch: currentBranch, conversationHistory: history })
                });
                const d = await r.json();
                l.remove();
                if (d.success) history.push({ role: 'user', content: m });
                else addMsg(`Error: ${d.error}`);
            } catch (e) { l.remove(); addMsg(`Error: ${e.message}`); }
        }
        socket.on('manus_task_update', d => addMsg(`[${d.status}] ${d.output || ''}`, 'system'));
        socket.on('manus_task_completed', d => addMsg(d.error ? `Failed: ${d.error}` : `Completed: ${d.finalOutput}`));
        sendButton.onclick = send;
        init();
    </script>
</body>
</html>
