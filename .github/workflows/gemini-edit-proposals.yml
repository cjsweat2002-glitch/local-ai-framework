name: Gemini Edit Proposals
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: gemini-edit-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      !startsWith(github.event.comment.body, '@gemini-cli /approve') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Plan a Gemini edit proposal
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          use_vertex_ai: 'true'
          gcp_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          gcp_location: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}
          gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          github_pr_number: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: gemini-edit-plan
          settings: >-
            {"mcpServers":{"github":{"command":"docker","args":["run","-i","--rm","-e","GITHUB_PERSONAL_ACCESS_TOKEN","ghcr.io/github/github-mcp-server:v0.27.0"],"includeTools":["add_issue_comment","issue_read","pull_request_read","get_file_contents","list_commits","search_code"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GITHUB_TOKEN}"}}},"tools":{"core":[]}}
          prompt: /gemini-edit-plan

      - name: Record plan milestone in Activity Pulse
        continue-on-error: true
        env:
          ACTIVITY_PULSE_URL: https://autonomaai-btpk72xz.manus.space
          ACTIVITY_PULSE_AUDIENCE: autonomous-ai-hub/activity-pulse
        run: |
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ACTIVITY_PULSE_AUDIENCE}" | jq -r '.value')"
          curl --fail-with-body --retry 2 --retry-delay 2 \
            --request POST "${ACTIVITY_PULSE_URL}/api/activity-pulse/github" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"phase\":\"plan_ready\",\"issueNumber\":${{ github.event.issue.number }},\"runId\":\"${{ github.run_id }}\"}"

  apply:
    if: >-
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '@gemini-cli /approve') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Apply the approved Gemini edit proposal
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          use_vertex_ai: 'true'
          gcp_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          gcp_location: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          gcp_service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}
          gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          github_pr_number: ${{ github.event.issue.pull_request && github.event.issue.number || '' }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: gemini-edit-apply
          settings: >-
            {"mcpServers":{"github":{"command":"docker","args":["run","-i","--rm","-e","GITHUB_PERSONAL_ACCESS_TOKEN","ghcr.io/github/github-mcp-server:v0.27.0"],"includeTools":["add_issue_comment","issue_read","pull_request_read","get_file_contents","search_code","create_branch","create_or_update_file","create_pull_request"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GITHUB_TOKEN}"}}},"tools":{"core":[]}}
          prompt: /gemini-edit-apply

      - name: Record owner approval milestone in Activity Pulse
        continue-on-error: true
        env:
          ACTIVITY_PULSE_URL: https://autonomaai-btpk72xz.manus.space
          ACTIVITY_PULSE_AUDIENCE: autonomous-ai-hub/activity-pulse
        run: |
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ACTIVITY_PULSE_AUDIENCE}" | jq -r '.value')"
          curl --fail-with-body --retry 2 --retry-delay 2 \
            --request POST "${ACTIVITY_PULSE_URL}/api/activity-pulse/github" \
            --header "Authorization: Bearer ${OIDC_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"phase\":\"approval_received\",\"issueNumber\":${{ github.event.issue.number }},\"runId\":\"${{ github.run_id }}\"}"
